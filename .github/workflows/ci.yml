# Lint: xclip -sel c < .github/workflows/ci.yml # https://rhysd.github.io/actionlint/

name: CI

on:
  push:
    branches: [ 'trunk', 'wip/**' ]
    tags: [ 'v[0-9]*.[0-9]*' ]
  pull_request:
    branches: [ 'trunk' ]

permissions: { contents: read }

jobs:

  Build-And-Test:
    # Shared rule from the release-kit repository; differences become arguments
    uses: tim-janik/release-kit/.github/workflows/build-and-test.yml@trunk
    with:
      runs-on: ubuntu-24.04
      apt-packages: 'tzdata nano tmux asciinema pv bsdextrautils'
      make-targets: |
        apt-deps-install
        distcheck
      tarball-path: artifacts/jj-fzf-*.tar.zst
      tarball-dir: /tmp/jj-fzf
      tarball-targets: |
        all
        check
        -C contrib -f Makefile.mk check
        sudo install
        installcheck
        sudo uninstall
      post: |
        if [[ $GITHUB_REF_TYPE != tag ]]; then .github/workflows/release-test.sh; fi
        mkdir -p ~/.cache # Download test repo for screencasts
        git -C ~/.cache clone --bare --single-branch --shallow-since 2024-12-31 -b v0.29.0 https://github.com/jj-vcs/jj.git
        make test
      artifact-name: jj-fzf-Artifacts
      artifact-path: artifacts/
      artifact2-name: jj-fzf-Screencasts
      artifact2-path: screencasts/*.cast

  Release:
    if: github.ref_type == 'tag'        # constrained by on.push.tags
    needs: [ Build-And-Test ]
    runs-on: ubuntu-24.04
    permissions: { contents: write }    # allow github.token to create a release
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
    - { uses: actions/checkout@v7, with: { fetch-depth: 0, fetch-tags: true } }
    - run: git fetch --force --tags     # Fix actions/checkout#290
    - run: sudo apt-get update
    - run: sudo TZ=Etc/UTC DEBIAN_FRONTEND=noninteractive apt-get install -y tzdata nano tmux asciinema pv bsdextrautils
    - run: make apt-deps-install
    - run: .github/workflows/gh-release.sh --upload

  Ping-IRC:
    # Announce tag and trunk pushes unless cancelled
    if: ${{ !cancelled() && github.event_name == 'push' && (github.ref == 'refs/heads/trunk' || github.ref_type == 'tag') }}
    needs: [ Build-And-Test, Release ]
    uses: tim-janik/release-kit/.github/workflows/ping-irc.yml@trunk
    with: { jobs: "${{ join(needs.*.result, ' ') }}" }
