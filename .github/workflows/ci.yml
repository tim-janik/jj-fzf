# Lint: xclip -sel c < .github/workflows/ci.yml # https://rhysd.github.io/actionlint/

name: CI

on:
  push:
    branches: [ 'trunk', 'wip/**' ]
    tags: [ 'v[0-9]*.[0-9]*' ]
  pull_request:
    branches: [ 'trunk' ]

permissions: { contents: read }

jobs:

  Build-And-Test:
    runs-on: ubuntu-24.04
    steps:
    - { uses: actions/checkout@v7, with: { fetch-depth: 0, fetch-tags: true } }
    - run: git fetch --force --tags     # Fix actions/checkout#290
    - run: sudo apt-get update
    - run: sudo TZ=Etc/UTC DEBIAN_FRONTEND=noninteractive apt-get install -y tzdata nano tmux asciinema pv bsdextrautils
    - run: make apt-deps-install
    - name: Check removal evidence
      env:
        CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/trunk' }}
        CHECK_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        if [[ "$CHECK_BASE" =~ ^0+$ ]]; then CHECK_BASE=origin/trunk; fi
        make check-removals CHECK_BASE="$CHECK_BASE" CHECK_HEAD="$CHECK_HEAD"
    - run: |
        make -w distcheck
        mkdir /tmp/jj-fzf && tar xf artifacts/jj-fzf-*.tar.zst -C /tmp/jj-fzf --strip-components=1
    - uses: actions/upload-artifact@v7
      with: { name: jj-fzf-Artifacts, path: artifacts/ }
    - run: make -C /tmp/jj-fzf -w all -j`nproc`
    - run: make -C /tmp/jj-fzf -w check
    - run: sudo make -C /tmp/jj-fzf -w install
    - run: make -C /tmp/jj-fzf -w installcheck
    - run: sudo make -C /tmp/jj-fzf -w uninstall
    - name: Screencast Tests
      run: |
        mkdir -p ~/.cache # Download test repo for screencasts
        git -C ~/.cache clone --bare --single-branch --shallow-since 2024-12-31 -b v0.29.0 https://github.com/jj-vcs/jj.git
        make test
    - uses: actions/upload-artifact@v7
      with: { name: jj-fzf-Screencasts, path: screencasts/*.cast }

  Release:
    if: github.ref_type == 'tag'        # constrained by on.push.tags
    needs: [ Build-And-Test ]
    runs-on: ubuntu-24.04
    permissions: { contents: write }    # allow github.token to create a release
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
    - { uses: actions/checkout@v7, with: { fetch-depth: 0, fetch-tags: true } }
    - run: git fetch --force --tags     # Fix actions/checkout#290
    - run: sudo apt-get update
    - run: sudo TZ=Etc/UTC DEBIAN_FRONTEND=noninteractive apt-get install -y tzdata nano tmux asciinema pv bsdextrautils
    - run: make apt-deps-install
    - run: .github/workflows/gh-release.sh --upload

  Ping-IRC:
    # Announce tag and trunk pushes unless cancelled
    if: ${{ !cancelled() && github.event_name == 'push' && (github.ref == 'refs/heads/trunk' || github.ref_type == 'tag') }}
    needs: [ Build-And-Test, Release ]
    runs-on: ubuntu-latest
    steps:
    - { uses: actions/checkout@v7, with: { fetch-depth: 0 } }
    - run: git fetch --force --tags     # Fix actions/checkout#290
    - name: Ping-IRC
      continue-on-error: true
      if: ${{ !env.ACT }}  # IRCBOT_JOBS indicates 'success'
      env: { IRCBOT_JOBS: "${{ join(needs.*.result, ' ') }}" }
      run: .github/workflows/ircbot.py -s irc.libera.chat:6697 -G "#Anklang"
